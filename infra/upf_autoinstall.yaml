#cloud-config
# VirtualBox unattended template. No credentials are stored in this source file.
autoinstall:
  version: 1
  refresh-installer:
    update: false
  locale: en_US.UTF-8
  keyboard:
    layout: us
  identity:
    hostname: upf-01
    username: '@@VBOX_INSERT_USER_LOGIN@@'
    realname: 'EMS UPF Administrator'
    password: '@@VBOX_INSERT_USER_PASSWORD_SHACRYPT512@@'
  ssh:
    install-server: true
    allow-pw: true
  network:
    version: 2
    ethernets:
      enp0s3:
        dhcp4: true
      enp0s8:
        dhcp4: false
        addresses: [10.210.50.8/24]
        optional: true
  storage:
    layout:
      name: direct
    swap:
      size: 0
  updates: security
  user-data:
    timezone: Etc/UTC
  shutdown: reboot
